resources:
  jobs:
    monthly_random_forest_inference:
      name: "[${bundle.target}] monthly-random-forest-inference"
      schedule:
        quartz_cron_expression: "0 0 9 1 * ?"
        timezone_id: Asia/Kolkata
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      parameters:
        - name: model_version
          default: "7"
        - name: batch_month
          default: ""
      tasks:
        - task_key: run_monthly_inference
          notebook_task:
            notebook_path: ../../src/retail/08_batch_inference_random_forest.py
            base_parameters:
              model_version: "{{job.parameters.model_version}}"
              batch_month: "{{job.parameters.batch_month}}"
              batch_id: "{{job.id}}-{{job.start_time.iso_date}}"