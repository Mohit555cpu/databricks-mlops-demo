resources:
  jobs:
    train_random_forest:
      name: "[${bundle.target}] random-forest-training"
      schedule:
        quartz_cron_expression: "0 0 8 1 * ?"
        timezone_id: Asia/Kolkata
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: train_model
          notebook_task:
            notebook_path: ../../src/retail/04_train_random_forest.py
            base_parameters:
              run_date: "{{job.start_time.iso_datetime}}"
