# Databricks inference job resource configuration.

resources:
  jobs:
    ci_smoke_test:
      name: "[${bundle.target}] retail-mlops-ci-smoke-test"

      tasks:
        - task_key: smoke_test
          notebook_task:
            notebook_path: ../src/ci_smoke_test.py

    train_random_forest:
      name: "[${bundle.target}] random-forest-training"
      tasks:
        - task_key: train_model
          notebook_task:
            notebook_path: ../src/04_train_random_forest.py
            base_parameters:
              run_date: "{{job.start_time.iso_datetime}}"