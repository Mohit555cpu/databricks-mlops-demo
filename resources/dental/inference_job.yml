resources:
  jobs:
    dental_claims_inference:
      name: "[${bundle.target}] dental-claims-approved-inference"
      max_concurrent_runs: 1
      parameters:
        - name: batch_id
          default: ""
      environments:
        - environment_key: dental_inference
          spec:
            client: "1"
            dependencies:
              - "lightgbm>=4,<5"
      tasks:
        - task_key: forecast_with_champion
          notebook_task:
            notebook_path: ../../src/dental/dental_inference_forecast.py
            base_parameters:
              batch_id: "{{job.parameters.batch_id}}"
          environment_key: dental_inference
